events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Use Docker's embedded DNS resolver so upstream hostnames are
    # resolved per-request (not at startup), preventing crashes when
    # a service container restarts.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name localhost;

        # ── API ──────────────────────────────────────────────────────────────
        location /api/ {
            set $backend_upstream http://backend:3000;
            proxy_pass         $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;    # long timeout for streaming LLM responses
        }

        # ── WebSocket ─────────────────────────────────────────────────────────
        location /ws {
            set $backend_upstream http://backend:3000;
            proxy_pass         $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 3600s;   # keep WebSocket open for 1 hour
        }

        # ── Frontend (production: static files) ───────────────────────────────
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            # SPA fallback — serve index.html for all unknown routes
            try_files $uri $uri/ /index.html;
        }
    }
}
